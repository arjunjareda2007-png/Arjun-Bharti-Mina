<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <style>
      .bg { fill: #0a0a0a; }
      .fg { fill: #f5f5f5; }
      .serif-text {
        font-family: 'Playfair Display', 'Didot', 'Bodoni MT', 'Times New Roman', serif;
        font-weight: 700;
      }
    </style>
  </defs>
  <rect width="512" height="512" rx="128" class="bg" />
  
  <!-- Stylized Elegant AM Monogram -->
  <g transform="translate(256, 256)" text-anchor="middle" dominant-baseline="central">
    <text x="-48" y="10" font-size="280" font-family="'Playfair Display', 'Outfit', Georgia, serif" font-weight="700" fill="#fafafa" letter-spacing="-15">A</text>
    <text x="75" y="24" font-size="270" font-family="'Playfair Display', 'Outfit', Georgia, serif" font-weight="700" fill="#fafafa" letter-spacing="-10">M</text>
    
    <!-- Fine accent ligature stroke -->
    <path d="M -15 25 Q 15 25 35 15" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.8" />
  </g>
</svg>
